<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Youfin</title>
<meta name="theme-color" content="#0f0f0f">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="menu" data-i18n-aria-label="header.menu">☰</button>
  <a class="logo" href="#/" data-i18n-aria-label="header.home"><img src="logo-dark.svg" alt="Youfin" height="30"></a>
  <form id="sf"><input id="sq" type="search" data-i18n-placeholder="header.search" autocomplete="off"></form>
  <span class="grow"></span>
  <select id="lang" data-i18n-aria-label="header.language" data-i18n-title="header.language"></select>
  <a class="back" id="tojf" href="/web/" data-i18n="header.backToJellyfin"></a>
</header>
<nav id="nav">
  <h4 data-i18n="nav.discover"></h4>
  <a href="#/" data-r="home" data-i18n="nav.home"></a>
  <a href="#/new" data-r="new" data-i18n="nav.new"></a>
  <a href="#/videos" data-r="videos" data-i18n="nav.all"></a>
  <h4 data-i18n="nav.library"></h4>
  <a href="#/series" data-r="series,serie" data-i18n="nav.series"></a>
  <a href="#/single" data-r="single" data-i18n="nav.single"></a>
  <a href="#/channels" data-r="channels,mychannels,channel" data-i18n="nav.channels"></a>
  <a href="#/collections" data-r="collections,collection" data-i18n="nav.collections"></a>
  <a href="#/categories" data-r="categories,category" data-i18n="nav.categories"></a>
  <h4 data-i18n="nav.mine"></h4>
  <a href="#/resume" data-r="resume" data-i18n="nav.resume"></a>
  <a href="#/watchlater" data-r="watchlater" data-i18n="nav.watchlater"></a>
  <a href="#/favorites" data-r="favorites" data-i18n="nav.favorites"></a>
  <a href="#/history" data-r="history" data-i18n="nav.history"></a>
</nav>
<main id="main"></main>
<div id="selbar" hidden><span id="selcount"></span><button class="btn pri" id="selact" data-i18n="sel.action"></button><button class="btn" id="seldone" data-i18n="sel.done"></button></div>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
